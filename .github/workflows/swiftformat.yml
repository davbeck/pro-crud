name: swiftformat

on:
  push:
    branches: ["**"]
    paths:
      - "**.swift"
      - ".github/workflows/swiftformat.yml"
      - ".swiftformat"
      - "Package.resolved"
      - "bin/format"

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Configure build environment
        run: cp .env.example .env

      - name: Format Swift
        run: bin/format

      - uses: stefanzweifel/git-auto-commit-action@v7
        id: commit
        with:
          commit_message: format
          file_pattern: "*.swift"
          disable_globbing: true

      # GITHUB_TOKEN commits do not trigger push/pull_request workflows.
      # Dispatch CI explicitly so the formatted commit also receives checks.
      - name: Check the formatting commit
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run tests.yml --ref "$BRANCH"
