name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Configure build environment
        run: cp .env.example .env

      - name: Run SwiftLint
        run: bin/lint

  test:
    # Native 22 exact text-placement references were exported on macOS 27.0.1.
    # Keep AppKit and system fonts aligned with that environment.
    # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - name: Configure build environment
        run: cp .env.example .env

      - name: Report toolchain and OS
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test
